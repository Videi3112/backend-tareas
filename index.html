<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Funciones Madecel</title>
    <!-- Fuentes de Google Fonts para tipografía elegante -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Fondo elegante con gradiente oscuro suave */
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #f8fafc;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            padding: 35px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        h2 {
            font-weight: 700;
            font-size: 22px;
            text-align: center;
            margin-bottom: 24px;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        h3 {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 16px;
            color: #38bdf8;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus, select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            box-shadow: 0 6px 12px -2px rgba(3, 105, 161, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-registro {
            background: transparent;
            border: 1px solid #10b981;
            color: #34d399;
            margin-top: 10px;
        }

        .btn-registro:hover {
            background: rgba(16, 185, 129, 0.15);
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
        }

        .btn-logout {
            width: auto;
            padding: 6px 14px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            font-size: 12px;
        }

        .btn-logout:hover {
            background: #dc2626;
            color: #ffffff;
        }

        .oculto {
            display: none;
        }

        ul {
            list-style: none;
            margin-top: 16px;
        }

        li {
            background: #0f172a;
            border: 1px solid #334155;
            margin-bottom: 10px;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .btn-delete {
            width: auto;
            padding: 4px 10px;
            background: #ef4444;
            color: white;
            border-radius: 6px;
            margin: 0;
            font-size: 12px;
        }

        .btn-delete:hover {
            background: #b91c1c;
        }

        hr {
            border: none;
            border-top: 1px solid #334155;
            margin: 16px 0;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 0.03em;
        }

        .footer strong {
            color: #38bdf8;
        }

        #mensajeAuth {
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
            color: #f87171;
        }
    </style>
</head>
<body>

    <!-- Tarjeta de Autenticación -->
    <div id="vistaAuth" class="card">
        <h2>Acceso al sistema de funciones Madecel</h2>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <button id="btnLogin">Iniciar Sesión</button>
        <button id="btnRegistro" class="btn-registro">Registrarse</button>
        <p id="mensajeAuth"></p>
        
        <div class="footer">
            Diseñado y desarrollado por <strong>Videi</strong>
        </div>
    </div>

    <!-- Tarjeta Principal de la Aplicación -->
    <div id="vistaApp" class="card oculto">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <strong id="usuarioEmail" style="color: #38bdf8; font-size: 14px;"></strong>
            <button id="btnLogout" class="btn-logout">Salir</button>
        </div>
        <hr>
        <h3>Mis Tareas Protegidas</h3>
        <input type="text" id="tituloTarea" placeholder="Nueva tarea...">
        <select id="prioridadTarea">
            <option value="Alta">Prioridad: Alta</option>
            <option value="Media">Prioridad: Media</option>
            <option value="Baja">Prioridad: Baja</option>
        </select>
        <button id="btnAgregar">Agregar Tarea</button>

        <ul id="listaUI"></ul>

        <div class="footer">
            Diseñado y desarrollado por <strong>Videi</strong>
        </div>
    </div>

    <script>
        const API = "https://backend-tareas-api.onrender.com/api";

        const vistaAuth = document.getElementById("vistaAuth");
        const vistaApp = document.getElementById("vistaApp");
        const emailInput = document.getElementById("email");
        const passInput = document.getElementById("password");
        const mensajeAuth = document.getElementById("mensajeAuth");

        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("token");
            const emailGuardado = localStorage.getItem("emailUsuario");
            if (token && emailGuardado) {
                mostrarApp(emailGuardado);
            }
        });

        document.getElementById("btnRegistro").addEventListener("click", async () => {
            const res = await fetch(`${API}/registro`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: emailInput.value, password: passInput.value })
            });
            const data = await res.json();
            if (res.ok) {
                alert("Registrado exitosamente. Inicia sesión.");
                mensajeAuth.textContent = "";
            } else {
                mensajeAuth.textContent = data.error;
            }
        });

        document.getElementById("btnLogin").addEventListener("click", async () => {
            const res = await fetch(`${API}/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: emailInput.value, password: passInput.value })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem("token", data.token);
                localStorage.setItem("emailUsuario", data.usuario.email);
                mostrarApp(data.usuario.email);
            } else {
                mensajeAuth.textContent = data.error;
            }
        });

        document.getElementById("btnLogout").addEventListener("click", () => {
            localStorage.removeItem("token");
            localStorage.removeItem("emailUsuario");
            vistaApp.classList.add("oculto");
            vistaAuth.classList.remove("oculto");
        });

        function mostrarApp(email) {
            vistaAuth.classList.add("oculto");
            vistaApp.classList.remove("oculto");
            document.getElementById("usuarioEmail").textContent = email;
            obtenerTareas();
        }

        async function obtenerTareas() {
            const token = localStorage.getItem("token");
            const res = await fetch(`${API}/tareas`, {
                headers: { "Authorization": `Bearer ${token}` }
            });

            if (res.status === 401 || res.status === 403) {
                alert("Sesión expirada o inválida.");
                document.getElementById("btnLogout").click();
                return;
            }

            const tareas = await res.json();
            const lista = document.getElementById("listaUI");
            lista.innerHTML = "";
            tareas.forEach(t => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <span><strong>${t.titulo}</strong> (${t.prioridad})</span>
                    <button onclick="eliminarTarea(${t.id})" class="btn-delete">Eliminar</button>
                `;
                lista.appendChild(li);
            });
        }

        document.getElementById("btnAgregar").addEventListener("click", async () => {
            const titulo = document.getElementById("tituloTarea").value;
            const prioridad = document.getElementById("prioridadTarea").value;
            const token = localStorage.getItem("token");

            if (!titulo) return;

            await fetch(`${API}/tareas`, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({ titulo, prioridad })
            });
            document.getElementById("tituloTarea").value = "";
            obtenerTareas();
        });

        async function eliminarTarea(id) {
            const token = localStorage.getItem("token");
            await fetch(`${API}/tareas/${id}`, { 
                method: "DELETE",
                headers: { "Authorization": `Bearer ${token}` }
            });
            obtenerTareas();
        }
    </script>
</body>
</html>
